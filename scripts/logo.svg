<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <!--
    Canonical DashNotes mark (fountain-pen nib on a neumorphic tile).
    Rendered to: public/favicon.svg (inlined), public/icon-*.png, macos/AppIcon.iconset.
    Keep in sync with src/components/DashNotesLogo.tsx.
  -->
  <defs>
    <linearGradient id="dn-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F3FA"/>
      <stop offset="100%" stop-color="#DDE1EF"/>
    </linearGradient>
    <linearGradient id="dn-nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="dn-well" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#D3D8E8"/>
      <stop offset="100%" stop-color="#C4CADD"/>
    </radialGradient>
    <filter id="dn-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="5" dy="6" stdDeviation="6" flood-color="#AEB6CC" flood-opacity="0.55"/>
    </filter>
    <filter id="dn-nib-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3B1D7A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#dn-tile)" filter="url(#dn-soft)"/>
  <circle cx="64" cy="64" r="40" fill="url(#dn-well)"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
  <g filter="url(#dn-nib-shadow)">
    <path d="M64 104 C 70 96 86 82 86 60 C 86 44 80 34 76 30 L 52 30 C 48 34 42 44 42 60 C 42 82 58 96 64 104 Z" fill="url(#dn-nib)"/>
    <circle cx="64" cy="54" r="7" fill="#EDEFF7"/>
    <line x1="64" y1="62" x2="64" y2="99" stroke="#EDEFF7" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
