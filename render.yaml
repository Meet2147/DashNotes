services:
  - type: web
    name: dashnotes
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && node_modules/.bin/prisma generate && npm run build
    startCommand: sh start.sh
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 3000
      # Set in the Render dashboard, not bound to a blueprint-declared database.
      #
      # This used to be `fromDatabase: name: dashnotes-db`. When that database was
      # deleted and replaced, the reference went stale: a blueprint sync would
      # overwrite the working value in the dashboard with a pointer to a database
      # that no longer exists, and free-tier accounts only get one instance, so
      # re-declaring it here can also fail the deploy outright.
      #
      # Use the database's *External* connection string (the hostname ending in
      # .oregon-postgres.render.com), unless this service is in the same region as
      # the database, in which case the internal one is faster.
      - key: DATABASE_URL
        sync: false
      # next-auth refuses to start in production without a secret, which took
      # every /api/auth/* route down with a 500. generateValue creates one on
      # first deploy and keeps it stable afterwards — changing it would sign
      # every existing user out.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Resolves to the bare hostname (no scheme); next-auth assumes https,
      # which is what Render serves.
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: dashnotes
          property: host
      # Shared demo account on /login for testing. Read at runtime (NOT a
      # NEXT_PUBLIC_ var, which would be frozen into the bundle at build time).
      # Set to false before the app has real users.
      - key: ENABLE_DEMO_LOGIN
        value: true
      # Set in the Render dashboard; the AI features return 500 without it.
      - key: PERPLEXITY_API_KEY
        sync: false

# No `databases:` block on purpose. The original dashnotes-db was deleted and
# replaced by a database created in the dashboard, so declaring one here would
# either recreate an unused instance — free accounts allow only one, which fails
# the deploy — or leave a stale reference for DATABASE_URL to bind to. The
# database is managed in the dashboard; this service just reads DATABASE_URL.
