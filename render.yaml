services:
  - type: web
    name: dashnotes
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && node_modules/.bin/prisma generate && npm run build
    startCommand: sh start.sh
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: dashnotes-db
          property: connectionString
      # next-auth refuses to start in production without a secret, which took
      # every /api/auth/* route down with a 500. generateValue creates one on
      # first deploy and keeps it stable afterwards — changing it would sign
      # every existing user out.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Resolves to the bare hostname (no scheme); next-auth assumes https,
      # which is what Render serves.
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: dashnotes
          property: host
      # Shared demo account on /login for testing. Set to false before real users.
      - key: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
        value: true
      # Set in the Render dashboard; the AI features return 500 without it.
      - key: PERPLEXITY_API_KEY
        sync: false

databases:
  - name: dashnotes-db
    region: oregon
    plan: free
