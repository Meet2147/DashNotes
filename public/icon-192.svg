<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="192" height="192">
  <!--
    Canonical DashNotes mark: a hand-drawn purple paper plane looping across
    graph paper, leaving its trajectory behind it.
    Rendered to: public/favicon.svg (inlined), public/icon-*.png, macos/AppIcon.iconset.
    Keep in sync with src/components/DashNotesLogo.tsx.
  -->
  <defs>
    <clipPath id="dn-clip">
      <rect x="6" y="6" width="116" height="116" rx="28"/>
    </clipPath>
    <pattern id="dn-grid" width="10.5" height="10.5" patternUnits="userSpaceOnUse">
      <path d="M 10.5 0 L 0 0 0 10.5" fill="none" stroke="#D7E3F4" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Graph-paper tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#FDFEFF"/>
  <g clip-path="url(#dn-clip)">
    <rect x="6" y="6" width="116" height="116" fill="url(#dn-grid)"/>
    <!-- heavier grid every 4 squares, like real graph paper -->
    <path d="M 6 27 H 122 M 6 69 H 122 M 6 111 H 122 M 27 6 V 122 M 69 6 V 122 M 111 6 V 122"
          fill="none" stroke="#C9D9EF" stroke-width="1"/>
  </g>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="#E3E9F5" stroke-width="2"/>

  <!-- Trajectory: swoops in from the lower right with a loop-the-loop -->
  <path d="M 71 87
           C 79 97, 90 103, 98 97
           C 105 91, 104 81, 96 81
           C 88 81, 86 92, 95 96
           C 104 100, 112 96, 117 88"
        fill="none" stroke="#26232E" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Paper plane, nose to the upper left -->
  <!-- underside (dark) -->
  <path d="M 26 40 L 58 63 L 71 87 L 48 64 Z" fill="#7C4DEF"
        stroke="#26232E" stroke-width="3" stroke-linejoin="round"/>
  <!-- lower face (mid) -->
  <path d="M 26 40 L 88 57 L 71 87 L 58 63 Z" fill="#A78BFA"
        stroke="#26232E" stroke-width="3" stroke-linejoin="round"/>
  <!-- top face (light) -->
  <path d="M 26 40 L 88 57 L 58 63 Z" fill="#CBB8FB"
        stroke="#26232E" stroke-width="3" stroke-linejoin="round"/>
  <!-- fold crease -->
  <path d="M 26 40 L 58 63" fill="none" stroke="#26232E" stroke-width="2.4"
        stroke-linecap="round"/>
</svg>
